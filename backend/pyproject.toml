[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Scanwick FastAPI backend — multi-vertical (Ecommerce/Sales/Bank) analytics SaaS, with email/password + Google OAuth authentication"
authors = ["Scanwick Team <team@scanwick.com>"]
package-mode = false
[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
email-validator = "^2.0.0"
httpx = "^0.28.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "<5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
aiosqlite = "^0.20.0"
greenlet = "^3.0.0"
alembic = "^1.13"
psycopg = {extras = ["binary"], version = "^3.2"}
celery = "^5.6"
redis = "^8.0"
boto3 = "^1.34"
python-multipart = "^0.0.9"
pandas = "^2.1"
openpyxl = "^3.1"
numpy = "^2.0"
pymupdf = "^1.27"
statsmodels = "^0.14"
scikit-learn = "^1.5"
scipy = "^1.13"
rapidfuzz = "^3.0"
pyotp = "^2.9"
qrcode = "^8.0"
[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"
black = "^25.0"
pytest = "^8.0"
pytest-asyncio = "^1.0"
requests = "^2.31.0"
moto = {extras = ["s3"], version = "^5.0"}
pypdf = "^6.15.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
